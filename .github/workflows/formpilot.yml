name: FormPilot

on:
  push:
    branches: [main]
    paths: ['formpilot/**', '.github/workflows/formpilot.yml']
    tags: ['formpilot-v*']
  pull_request:
    paths: ['formpilot/**', '.github/workflows/formpilot.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: formpilot

jobs:
  test:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: formpilot/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: formpilot/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm compile
      - name: Unit tests
        run: pnpm test
      - name: Build extension
        run: pnpm build
      - name: Install Chromium for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (real Chromium + extension)
        run: pnpm exec playwright test
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: formpilot/test-results
          retention-days: 7
          include-hidden-files: true
      - name: Package
        run: pnpm zip
      - uses: actions/upload-artifact@v7
        with:
          name: formpilot-chrome
          path: formpilot/.output/*-chrome.zip
          include-hidden-files: true # .output is a dot-folder
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/formpilot-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: formpilot/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: formpilot/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#formpilot-v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[0-9]/ { print }
          ' CHANGELOG.md > ../release-notes.md
          test -s ../release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip \
            --title "FormPilot ${GITHUB_REF_NAME#formpilot-v}" \
            --notes-file ../release-notes.md
