<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>React Native Jobs | LinkedIn</title>
<style>
body{font:14px system-ui;margin:20px;display:grid;grid-template-columns:320px 1fr;gap:20px}
#list{height:300px;overflow-y:auto}
[role=button]{border:1px solid #ccc;border-radius:8px;padding:8px;margin:6px 0;cursor:pointer}
#pane{border:1px solid #ccc;border-radius:8px;padding:12px;min-height:200px}
/* LinkedIn's dialog is a centred modal */
dialog[data-testid=dialog]{position:fixed;top:20%;left:50%;transform:translateX(-50%);margin:0;padding:16px;border:1px solid #888;border-radius:8px;background:#fff;z-index:10}
</style>
</head>
<body>
<!-- Mirrors LinkedIn /jobs/search-results/ (Nov 2026): generated class names, cards are
     div[role=button] with a "Dismiss … job" button, no job id in the card; the job pane shows an
     "Easy Apply to this job" button; Easy Apply opens a dialog in a closed shadow root.
     Like the live page: the list shows a few cards and loads the rest on scroll; a card's lines
     are title, title, company (some add "(Verified job)"); Easy Apply puts ?companyName= in the
     address; the dialog frame opens before its fields load. -->
<div id="list"></div>
<div id="pane"><h2>Select a job</h2></div>
<div id="interop-outlet"></div>
<script>
const jobs = [
  { id: 1, title: 'React Native Developer', company: 'Collegedunia', loc: 'Gurugram (On-site)', applied: true, easy: true },
  { id: 2, title: 'Mobile Engineer', company: 'Acme', loc: 'Bengaluru (Hybrid)', applied: false, easy: true },
  { id: 3, title: 'Backend Engineer', company: 'Gamma', loc: 'Pune', applied: false, easy: false },
  { id: 4, title: 'Engineering Manager (Mobile)', company: 'Delta', loc: 'Bengaluru', applied: false, easy: true },
  { id: 5, title: 'SDE 2 - React Native', company: 'Beta', loc: 'Remote', applied: false, easy: true },
];
window.__opened = []; window.__untrustedSubmit = false; window.__sent = [];
let shown = 3;
const list = document.getElementById('list'), pane = document.getElementById('pane');
const host = document.getElementById('interop-outlet');
const root = host.attachShadow({ mode: 'closed' });
window.__root = root;
function renderList() {
  list.innerHTML = '';
  for (const j of jobs.slice(0, shown)) {
    const wrap = document.createElement('div'); wrap.className = 'k4dayq';
    wrap.innerHTML = `<div role="button" tabindex="0" componentkey="ck-${j.id}" style="min-height:110px">
      <div><span>${j.title}${j.id % 2 ? ' (Verified job)' : ''}</span></div><div><span>${j.title}</span></div><p>${j.company}</p><p>${j.loc}</p>
      ${j.applied ? '<div>Applied</div>' : ''}<div> · </div>${j.easy ? '<div>Easy Apply</div>' : ''}
      <button aria-label="Dismiss ${j.title} job">×</button></div>`;
    wrap.firstElementChild.onclick = (e) => { if (e.target.closest('button')) return; select(j); };
    list.appendChild(wrap);
  }
}
function select(j) {
  history.replaceState(null, '', location.pathname.replace(/\/jobs\/view\/\d+\/?$/, '') + '?currentJobId=' + j.id);
  // Like LinkedIn: the old job (and its Easy Apply button) stays on screen while the new one loads.
  setTimeout(() => {
    pane.innerHTML = `<a href="/jobs/view/${j.id}/">${j.title}</a><p><a href="https://www.linkedin.com/company/${j.company.toLowerCase()}/life">${j.company} Pvt Ltd</a></p>` +
      (j.applied ? '<h2>Application status</h2>' : j.easy ? `<button type="button" aria-label="Easy Apply to this job" componentkey="ea">Easy Apply</button>` : '<button type="button">Apply</button>');
    const b = pane.querySelector('[aria-label="Easy Apply to this job"]');
    if (b) b.onclick = () => {
      // Live LinkedIn (17 Nov): while "Save this application?" is open, Easy Apply does nothing.
      if (document.getElementById('confirm')) { window.__blocked = (window.__blocked || 0) + 1; return; }
      history.pushState(null, '', '/jobs/view/' + j.id + '/?companyName=' + encodeURIComponent(j.company + ' Private Limited') + '&applicantTrackingSystemName=LinkedIn'); openDialog(j); };
  }, 1500);
}
const css = `<style>.fb-form-element__checkbox{position:absolute;opacity:0;width:1px;height:1px}
  label{display:inline-block;border:1px solid #666;border-radius:16px;padding:3px 12px;margin:3px}</style>`;
function openDialog(j) {
  window.__opened.push(j.title);
  const native = j.id === 5;
  let r = root;
  if (native) {
    let d = document.getElementById('native');
    if (!d) { d = document.createElement('div'); d.id = 'native'; document.body.appendChild(d); }
    r = d;
  }
  window.__dlgRoot = r;
  const body = (native ? '' : css) + `<${native ? 'dialog open data-testid="dialog"' : 'div role="dialog" aria-modal="true" tabindex="-1"'}>
    <h2>Apply to ${j.company}</h2><button aria-label="Dismiss" id="x">×</button>
    <div id="s1">
      <fieldset><legend><span aria-hidden="true">Are you comfortable commuting to this job's location?</span><span class="visually-hidden">Are you comfortable commuting to this job's location?</span>*</legend>
        <input class="fb-form-element__checkbox" type="radio" name="c${j.id}" id="y${j.id}" value="Yes" required><label for="y${j.id}">Yes</label>
        <input class="fb-form-element__checkbox" type="radio" name="c${j.id}" id="n${j.id}" value="No" required><label for="n${j.id}">No</label></fieldset>
      <label for="phone">Mobile phone number</label><input id="phone" required>
      <button id="review" type="button"><span>Review</span></button></div>
    <div id="s2" hidden><button id="send" type="button"><span>Submit application</span></button></div>
  </${native ? 'dialog' : 'div'}>`;
  // The dialog frame and heading appear first; the step's fields load a moment later.
  r.innerHTML = body.replace(/<div id="s1">[\s\S]*<\/div>\s*<div id="s2" hidden>[\s\S]*?<\/div>/, '<p>Loading…</p>');
  setTimeout(() => wire(j, r, body, native), 1200);
}
function wire(j, r, body, native) {
  r.innerHTML = body;
  const q = (sel) => r.querySelector(sel);
  const dlg = q('[role=dialog], dialog');
  dlg.focus?.();
  q('#review').onclick = () => {
    const ok = q(`[name="c${j.id}"]:checked`) && q('#phone').value;
    if (!ok) return;
    q('#s1').remove(); q('#s2').hidden = false;
  };
  q('#send').onclick = (e) => {
    if (!e.isTrusted && !window.__allowScripted) { window.__untrustedSubmit = true; return; }
    setTimeout(() => {
      window.__sent.push(j.title); j.applied = true; renderList();
      // LinkedIn (Nov 2026) often just closes the dialog after Submit; the pane then shows the status.
      if (window.__closeOnSubmit) { r.innerHTML = ''; const h = document.createElement('h2'); h.textContent = 'Application status'; document.body.appendChild(h); return; }
      dlg.innerHTML = `<h2>Application sent</h2><p>Your application was sent to ${j.company}!</p><button type="button">Done</button>`;
      dlg.querySelector('button').onclick = () => { r.innerHTML = ''; };
    }, 300);
  };
  q('#x').onclick = () => {
    r.innerHTML = '';
    // Live LinkedIn: closing asks "Save this application?" in a second dialog.
    if (!window.__confirmOnDismiss) return;
    const c = document.createElement('dialog');
    c.id = 'confirm'; c.setAttribute('data-testid', 'dialog'); c.open = true;
    c.innerHTML = '<h2>Save this application?</h2><p>Save to return to this application later.</p><button type="button" aria-label="Dismiss">×</button><button type="button" id="discard">Discard</button><button type="button">Save</button>';
    document.body.appendChild(c);
    c.querySelector('#discard').onclick = () => c.remove();
  };
}
list.addEventListener('scroll', () => {
  if (shown < jobs.length && list.scrollTop + list.clientHeight >= list.scrollHeight - 30) setTimeout(() => { shown = jobs.length; const t = list.scrollTop; renderList(); list.scrollTop = t; }, 400);
});
renderList();
</script>
</body>
</html>
