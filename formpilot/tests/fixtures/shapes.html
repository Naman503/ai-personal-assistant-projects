<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Screening questions</title></head>
<body>
<form>
  <label for="notice">Notice period (in days)</label><input id="notice" inputmode="numeric">
  <label for="ctc">Current CTC (INR, annual, in lacs)</label><input id="ctc">
  <label for="exp">Total experience</label>
  <select id="exp"><option value="">Select</option><option value="a">0-1 years</option><option value="b">1-3 years</option><option value="c">3-5 years</option><option value="d">5+ years</option></select>
  <label for="np2">Notice period</label>
  <select id="np2"><option value="">Select</option><option>Immediate</option><option>15 days or less</option><option>1 Month</option><option>2 Months</option><option>3 Months</option></select>
  <label for="lwd">Mention your official LWD in DDMMYY format</label><input id="lwd">
  <label for="mob">Mobile number</label><input id="mob" type="tel" maxlength="10">
</form>
</body></html>
