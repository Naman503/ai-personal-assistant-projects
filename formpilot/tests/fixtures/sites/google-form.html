  });
  list.addEventListener('keydown', function (e) {
    var t = e.target;
    if ((e.key === ' ' || e.key === 'Enter') && t.matches('[role=radio]')) { e.preventDefault(); selectRadio(t); }
    if ((e.key === ' ' || e.key === 'Enter') && t.matches('[role=checkbox]')) { e.preventDefault(); toggleCheckbox(t); }
    if (t.matches('[role=listbox]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.classList.add('open'); t.setAttribute('aria-expanded', 'true'); }
  });
  document.addEventListener('click', function (e) { document.querySelectorAll('[role=listbox].open').forEach(function (lb) { if (!lb.contains(e.target)) closeListbox(lb); }); });

  // ---- validation / navigation ----
  function clearError(li) { if (!li) return; li.classList.remove('HHgTUd'); var a = li.querySelector('.SL4Sz'); if (a) a.textContent = ''; }
  function validatePage() {
    var ok = true, first = null;
    pages[page].forEach(function (it) {
      if (it[3] === 8 || !it[4][0][2]) return;
      var eid = it[4][0][0], v = answers[eid];
      var empty = v == null || v === '' || (Array.isArray(v) && !v.length);
      var bad = !empty && it[4][0][3] && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
      if (empty || bad) {
        ok = false;
        var li = document.querySelector('[data-entry="' + eid + '"]').closest('.Qr7Oae');
        li.classList.add('HHgTUd');
        li.querySelector('.SL4Sz').textContent = empty ? 'This is a required question' : it[4][0][3][0][3];
        first = first || li;
      }
    });
    if (first) first.scrollIntoView({ block: 'center' });
    return ok;
  }
  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]'); if (!b) return;
    var a = b.getAttribute('data-nav');
    if (a === 'next') { if (validatePage()) { page++; renderPage(); } }
    else if (a === 'back') { page--; renderPage(); }
    else if (a === 'clear') { answers = {}; document.getElementById('entry-store').innerHTML = ''; page = 0; renderPage(); }
    else if (a === 'submit') {
      if (!validatePage()) return;
      var out = {};
      Object.keys(answers).forEach(function (k) { var v = answers[k]; if (v === '' || v == null || (Array.isArray(v) && !v.length)) return; out[k.indexOf('.') > 0 ? 'entry.' + k : 'entry.' + k] = v; });
      window.__submitted = out;
      document.querySelector('.lrKTG').innerHTML =
        '<div class="Dq4amc"><div class="m7w29c O8VmIc tIvQIf"><div class="N0gd6"><div class="ahS2Le"><div class="F9yp7e ikZYwf LgNcQe" dir="auto" role="heading" aria-level="1">Acme Labs - Senior React Native Engineer Application</div></div></div>' +
        '<div class="vHW8K">Your response has been recorded.</div><div class="c2gzEf"><a href="#">Submit another response</a></div></div></div>';
      location.hash = '#formResponse';
    }
  });
  document.getElementById('nav').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { var b = e.target.closest('[data-nav]'); if (b) { e.preventDefault(); b.click(); } } });
  document.getElementById('mG61Hd').addEventListener('submit', function (e) { e.preventDefault(); });

  renderPage();
})();
</script>
