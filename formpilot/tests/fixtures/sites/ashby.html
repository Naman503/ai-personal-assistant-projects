<!doctype html>
<!--
  Fixture: Ashby hosted job board application tab (jobs.ashbyhq.com/<org>/<postingId>/application).
  The live page is a client-rendered React SPA (empty #root in the HTML). Structure here is rebuilt
  from Ashby's production bundle (Nov 2026): the stable public "ashby-*" class names (Ashby's
  documented custom-CSS hooks) are exact; the hashed CSS-module classes (_fieldEntry_1e3gg_28 etc.)
  are copied from the same bundle but WILL change between Ashby deploys - never select on them.
  Field definitions mirror the ApiJobPosting GraphQL form schema (paths like _systemfield_name,
  _systemfield_email, _systemfield_location, _systemfield_resume, uuid paths for custom questions).
  Key behaviours:
    - there is NO <form> element; the submit is a plain <button> (.ashby-application-form-submit-button);
    - text/textarea are React-controlled: value only registers through an `input` event;
    - Boolean questions = two buttons (.ashby-application-form-input-yesno-option, data-option=yes|no,
      aria-pressed) + a hidden checkbox; clicking a button is what drives it;
    - ValueSelect with <=8 options = radio group (fieldset.ashby-application-form-input-radio-group),
      >8 options = autocomplete combobox (type, then click a [role=option] or press Enter);
    - Location = autocomplete (.ashby-application-form-input-autocomplete), results popup is rendered
      in a PORTAL at the end of <body>; blur without picking reverts the text;
      its <label for> points at the field path but the input has no id (label not associated);
    - Resume: react-dropzone hidden input (display:none) inside .ashby-application-form-input-file;
      "Upload File" button opens it. Separate "Autofill from resume" pane at the top parses the file
      and fills empty name/email/phone/LinkedIn and attaches the resume;
    - ValueSelect / MultiValueSelect entries are NOT wrapped in .ashby-application-form-field-entry
      (only in a div[data-field-path]); the label sits inside the fieldset;
    - EEOC survey is a second .ashby-application-form-container inside .ashby-survey-form-container;
    - errors: "Your form needs corrections" alert listing fields; success:
      .ashby-application-form-success-container (role=status) "Success" + Ashby's default message.
  window.__submitted = { path: value } after success; location.hash -> "#submitted".
-->
<html lang="en">

<body>
<div id="root">

</div>

<script>
(function () {
  'use strict';
  var ORG = 'acmelabs';
  // Form schema in the shape returned by Ashby's ApiJobPosting GraphQL (applicationForm + surveyForms).
  var APPLICATION = [
    { id: 'e1a0-0001', path: '_systemfield_name', title: 'Name', type: 'String', required: true },
    { id: 'e1a0-0002', path: '_systemfield_email', title: 'Email', type: 'Email', required: true },
    { id: 'e1a0-0003', path: '4b71793a-0003-4c95-9d06-acme00000003', title: 'Phone', type: 'Phone', required: true },
    { id: 'e1a0-0004', path: '_systemfield_location', title: 'Current location', type: 'Location', required: true },
    { id: 'e1a0-0005', path: '_systemfield_resume', title: 'Resume', type: 'File', required: true },
    { id: 'e1a0-0006', path: 'dc915b3a-0006-49df-abd6-acme00000006', title: 'LinkedIn Profile', type: 'String', required: true },
    { id: 'e1a0-0007', path: '9a0e0001-0007-4d00-8000-acme00000007', title: 'How many years of professional React Native experience do you have?', type: 'Number', required: true },
    { id: 'e1a0-0008', path: '9a0e0001-0008-4d00-8000-acme00000008', title: 'What is your notice period?', type: 'ValueSelect', required: true, options: ['Immediate', '15 days or less', '30 days', '60 days', '90 days'] },
    { id: 'e1a0-0009', path: '9a0e0001-0009-4d00-8000-acme00000009', title: 'Current CTC (INR per annum)', type: 'String', required: true },
    { id: 'e1a0-0010', path: '9a0e0001-0010-4d00-8000-acme00000010', title: 'Expected CTC (INR per annum)', type: 'String', required: true },
    { id: 'e1a0-0011', path: '3080cfba-0011-4cc4-94b9-acme00000011', title: 'Are you legally authorized to work in India?', type: 'Boolean', required: true },
    { id: 'e1a0-0012', path: '3080cfba-0012-4cc4-94b9-acme00000012', title: 'Are you willing to relocate to Bengaluru?', type: 'Boolean', required: true },
    { id: 'e1a0-0013', path: '0b3b7773-0013-4e95-9a01-acme00000013', title: 'Which platforms have you shipped production apps to?', type: 'MultiValueSelect', required: false, options: ['iOS', 'Android', 'Web (React Native Web)'] },
    { id: 'e1a0-0014', path: '0b3b7773-0014-4e95-9a01-acme00000014', title: 'How did you hear about this opportunity?', type: 'ValueSelect', required: false, options: ['LinkedIn', 'Company website', 'Employee referral', 'Naukri', 'Instahyre', 'Wellfound', 'Hacker News', 'Twitter / X', 'Conference or meetup', 'Other'] },
    { id: 'e1a0-0015', path: '0086e069-0015-467b-8d38-acme00000015', title: 'Why do you want to join Acme Labs?', type: 'LongText', required: true }
  ];
  var SURVEY = [
    { id: 'e1a0-0101', path: '_systemfield_eeoc_gender', title: 'Gender', type: 'ValueSelect', required: false, options: ['Male', 'Female', 'Decline to self-identify'] },
    { id: 'e1a0-0102', path: '_systemfield_eeoc_race', title: 'Race', type: 'ValueSelect', required: false, options: ['Hispanic or Latino', 'White (Not Hispanic or Latino)', 'Black or African American (Not Hispanic or Latino)', 'Native Hawaiian or Other Pacific Islander (Not Hispanic or Latino)', 'Asian (Not Hispanic or Latino)', 'American Indian or Alaska Native (Not Hispanic or Latino)', 'Two or More Races (Not Hispanic or Latino)', 'Decline to self-identify'] },
    { id: 'e1a0-0103', path: '_systemfield_eeoc_veteran_status', title: 'Veteran Status', type: 'ValueSelect', required: false, options: ['I identify as one or more of the classifications of protected veteran listed above', 'I am not a protected veteran', 'I decline to self-identify for protected veteran status'] }
  ];
  var LOCATIONS = ['Bengaluru, Karnataka, India', 'Bengaluru Rural, Karnataka, India', 'Mumbai, Maharashtra, India', 'Pune, Maharashtra, India', 'Hyderabad, Telangana, India', 'Chennai, Tamil Nadu, India', 'Karnataka, India', 'India'];

  var values = {};      // React state per field path
  var uploading = false;

  function h(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function label(f) {
    return h('label', { class: '_heading_f7cvd_52 ' + (f.required ? '_required_f7cvd_91 ' : '') + '_label_1e3gg_42 ashby-application-form-question-title', for: f.path, text: f.title });
  }
  function set(path, v) { values[path] = v; var err = document.querySelector('[data-error-for="' + CSS.escape(path) + '"]'); if (err) err.remove(); }

  function textInput(f, type, placeholder) {
    var inp = h('input', { class: '_input_1jjuj_28 _input_1e3gg_32 ashby-application-form-input-text', type: type, placeholder: placeholder, name: f.path, id: f.path, required: f.required, value: '' });
    inp.addEventListener('input', function () { set(f.path, inp.value); });
    return h('div', {}, [inp]);
  }
  function fieldEntry(f, input) {
    return h('div', { class: '_fieldEntry_1e3gg_28 ashby-application-form-field-entry', 'data-field-path': f.path, 'data-field-entry-id': f.id }, [label(f), input]);
  }

  // Autocomplete (floating-ui; popup in a portal appended to <body>)
  function autocomplete(f, source) {
    var selectedText = '';
    var wrap = h('div', { class: '_inputContainer_d7ago_1' });
    var listId = 'floating-ui-' + f.id;
    var inp = h('input', { class: '_input_d7ago_1 ashby-application-form-input-autocomplete', placeholder: 'Start typing...', 'aria-autocomplete': 'list', role: 'combobox', 'aria-expanded': 'false', 'aria-haspopup': 'listbox', autocomplete: 'off', value: '' });
    var toggle = h('button', { class: '_container_pjyt6_1 _toggleButton_d7ago_60', type: 'button', 'aria-label': 'Toggle', text: '▾' });
    wrap.appendChild(inp); wrap.appendChild(toggle);
    var popup = null, active = null, results = [];
    function close() { if (popup) { popup.remove(); popup = null; } inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-controls'); active = null; }
    function render(loading) {
      if (!popup) {
        popup = h('div', { class: '_floatingContainer_d7ago_103', role: 'listbox', id: listId });
        var r = inp.getBoundingClientRect();
        popup.style.left = (r.left + window.scrollX) + 'px'; popup.style.top = (r.bottom + window.scrollY + 4) + 'px'; popup.style.width = r.width + 'px';
        document.body.appendChild(popup);
        inp.setAttribute('aria-expanded', 'true'); inp.setAttribute('aria-controls', listId);
      }
      popup.innerHTML = '';
      var c = h('div', { class: '_resultContainer_d7ago_116 ashby-application-form-input-autocomplete-popup' });
      if (loading) { c.setAttribute('data-loading', ''); c.appendChild(h('div', { class: '_loading_d7ago_93 ashby-application-form-input-autocomplete-popup-loading', text: 'Loading...' })); }
      else if (!results.length) { c.setAttribute('data-empty', ''); c.appendChild(h('div', { class: '_noResults_d7ago_98 ashby-application-form-input-autocomplete-popup-empty' }, [h('p', { text: 'No results' })])); }
      else results.forEach(function (r, i) {
        var o = h('div', { role: 'option', id: listId + '-opt-' + i, 'aria-selected': String(active === i), class: '_result_d7ago_107' + (active === i ? ' _active_d7ago_88' : '') + ' ashby-application-form-input-autocomplete-popup-result', text: r });
        o.addEventListener('mousedown', function (e) { e.preventDefault(); });
        o.addEventListener('click', function () { choose(r); });
        c.appendChild(o);
      });
      popup.appendChild(c);
    }
    function choose(r) { selectedText = r; inp.value = r; set(f.path, r); close(); inp.focus(); }
    function search() {
      var q = inp.value.trim().toLowerCase();
      if (!q) { set(f.path, undefined); selectedText = ''; }
      active = 0;
      render(true);
      setTimeout(function () { results = source.filter(function (s) { return !q || s.toLowerCase().indexOf(q) !== -1; }); if (popup) render(false); }, 250);
    }
    inp.addEventListener('input', search);
    inp.addEventListener('keydown', function (e) {
      if (!popup) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min((active == null ? -1 : active) + 1, results.length - 1); render(false); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max((active || 0) - 1, 0); render(false); }
      else if (e.key === 'Enter') { if (active != null && results[active]) { e.preventDefault(); choose(results[active]); } }
      else if (e.key === 'Escape') close();
    });
    inp.addEventListener('blur', function () { setTimeout(function () { inp.value = selectedText; close(); }, 0); });
    toggle.addEventListener('click', function () { if (popup) close(); else { inp.focus(); results = source.slice(0, 8); active = null; render(false); } });
    return wrap;
  }

  function fileInput(f, onPicked) {
    var accept = '.pdf,.doc,.docx,.odt,.rtf,.txt,application/pdf';
    var root = h('div', { class: '_container_6k3nb_71 ashby-application-form-input-file', role: 'presentation', tabindex: '0' });
    var inp = h('input', { type: 'file', accept: accept, multiple: false, tabindex: '-1', style: 'display: none;', id: f.path, required: f.required });
    var items = h('div', {});
    var btnSpan = h('span', { text: 'Upload File' });
    var btn = h('button', { class: '_button_8wvgw_29 _secondary_8wvgw_116 ashby-application-form-input-file-dropzone-upload', type: 'button' }, [btnSpan]);
    var zone = h('div', { class: '_instructions_6k3nb_120 ashby-application-form-input-file-dropzone' }, [btn, h('p', { class: '_dragInstructions_6k3nb_130 ashby-application-form-input-file-dropzone-instructions', text: 'or drag and drop here' })]);
    root.appendChild(inp); root.appendChild(items); root.appendChild(zone);
    btn.addEventListener('click', function () { inp.click(); });
    function show(name) {
      items.innerHTML = '';
      if (!name) { btnSpan.textContent = 'Upload File'; return; }
      var del = h('button', { class: '_button_8wvgw_29 ashby-application-form-input-file-item-delete', title: 'Delete file', type: 'button', text: '✕' });
      del.addEventListener('click', function () { set(f.path, undefined); inp.value = ''; show(null); });
      items.appendChild(h('div', { class: '_file_6k3nb_1 ashby-application-form-input-file-item' }, [h('p', { class: '_name_6k3nb_10 ashby-application-form-input-file-item-name' }, [h('span', { text: name })]), del]));
      btnSpan.textContent = 'Replace';
    }
    function accept1(file) { if (!file) return; uploading = true; set(f.path, file.name); show(file.name); setTimeout(function () { uploading = false; }, 200); if (onPicked) onPicked(file); }
    inp.addEventListener('change', function () { accept1(inp.files && inp.files[0]); });
    root.addEventListener('dragover', function (e) { e.preventDefault(); root.classList.add('_dragging_6k3nb_99'); });
    root.addEventListener('dragleave', function () { root.classList.remove('_dragging_6k3nb_99'); });
    root.addEventListener('drop', function (e) { e.preventDefault(); root.classList.remove('_dragging_6k3nb_99'); accept1(e.dataTransfer.files[0]); });
    root._show = show;
    return root;
  }

  function yesNo(f) {
    var cb = h('input', { type: 'checkbox', class: '_input_1svni_78', tabindex: '-1', name: f.path });
    var yes = h('button', { class: '_container_pjyt6_1 _option_1svni_32 ashby-application-form-input-yesno-option', 'aria-pressed': 'false', 'data-option': 'yes', type: 'button', text: 'Yes' });
    var no = h('button', { class: '_container_pjyt6_1 _option_1svni_32 _yesno_sep ashby-application-form-input-yesno-option', 'aria-pressed': 'false', 'data-option': 'no', type: 'button', text: 'No' });
    function apply(v) {
      set(f.path, v);

    no.addEventListener('click', function () { apply(values[f.path] === false ? undefined : false); });
    cb.addEventListener('change', function () { apply(cb.checked); });
    return h('div', { class: '_container_1svni_28 _yesno_1e3gg_148 ashby-application-form-input-yesno' }, [yes, no, cb]);

  function radioGroup(f) {
    var fs = h('fieldset', { class: '_container_1jwq4_28 _fieldEntry_1e3gg_28 ashby-application-form-input-radio-group' }, [label(f)]);
    f.options.forEach(function (o, i) {

      var opt = h('div', { class: '_option_1jwq4_40 ashby-application-form-input-radio-group-option' }, [
        h('span', { class: '_container_1danv_28 ashby-application-form-input-radio-group-option-radio' }, [r]),
        h('label', { for: id, class: '_label_1jwq4_50 ashby-application-form-input-radio-group-option-label', text: o })
      ]);
      r.addEventListener('change', function () {
        if (!r.checked) return;
        set(f.path, o);
        fs.querySelectorAll('.ashby-application-form-input-radio-group-option').forEach(function (d) { d.removeAttribute('data-checked'); });
        opt.setAttribute('data-checked', '');

      fs.appendChild(opt);

    return h('div', { 'data-field-path': f.path, 'data-field-entry-id': f.id }, [fs]);
  }
  function checkboxGroup(f) {
    var fs = h('fieldset', { class: '_container_1jwq4_28 _fieldEntry_1e3gg_28 ashby-application-form-input-checkbox-group' }, [label(f)]);
    var sel = [];
    f.options.forEach(function (o, i) {
      var id = f.id + '-labeled-checkbox-' + i;
      var c = h('input', { type: 'checkbox', id: id, name: o });
      var opt = h('div', { class: '_option_1jwq4_40 ashby-application-form-input-checkbox-group-option' }, [
        h('span', { class: '_container_1danv_28 ashby-application-form-input-checkbox-group-option-checkbox' }, [c]),
        h('label', { for: id, class: '_label_1jwq4_50 ashby-application-form-input-checkbox-group-option-label', text: o })
      ]);
      c.addEventListener('change', function () {
        if (c.checked) { if (sel.indexOf(o) < 0) sel.push(o); opt.setAttribute('data-checked', ''); }
        else { sel = sel.filter(function (x) { return x !== o; }); opt.removeAttribute('data-checked'); }
        set(f.path, sel.slice());
      });
      fs.appendChild(opt);
    });
    return h('div', { 'data-field-path': f.path, 'data-field-entry-id': f.id }, [fs]);
  }
  function bigSelect(f) {
    var fs = h('fieldset', { class: '_container_bigsel_28 _fieldEntry_1e3gg_28' }, [label(f), autocomplete(f, f.options)]);
    return h('div', { 'data-field-path': f.path, 'data-field-entry-id': f.id }, [fs]);
  }

  var resumeWidget = null;
  function renderField(f) {
    switch (f.type) {
      case 'String': return fieldEntry(f, textInput(f, 'text', 'Type here...'));
      case 'Email': return fieldEntry(f, textInput(f, 'email', 'hello@example.com...'));
      case 'Number': return fieldEntry(f, textInput(f, 'number', 'Type here...'));
      case 'Phone': return fieldEntry(f, textInput(f, 'tel', '1-415-555-1234...'));
      case 'LongText': {
        var ta = h('textarea', { class: '_input_zf0lr_28 _input_1e3gg_32 ashby-application-form-input-textarea', placeholder: 'Type here...', name: f.path, id: f.path, rows: '4', required: f.required });
        ta.addEventListener('input', function () { set(f.path, ta.value); });
        return fieldEntry(f, ta);
      }
      case 'Location': return fieldEntry(f, autocomplete(f, LOCATIONS));
      case 'File': resumeWidget = fileInput(f); return fieldEntry(f, resumeWidget);
      case 'Boolean': return fieldEntry(f, yesNo(f));
      case 'ValueSelect': return f.options.length > 8 ? bigSelect(f) : radioGroup(f);
      case 'MultiValueSelect': return checkboxGroup(f);
    }
  }

  function formContainer(fields, withErrorsSlot) {
    var c = h('div', { class: '_jobPostingForm_ _card ashby-application-form-container' });
    if (withErrorsSlot) c.appendChild(h('div', { id: 'form-errors' }));
    var sec = h('div', { class: '_section_ ashby-application-form-section-container' });
    fields.forEach(function (f) { sec.appendChild(renderField(f)); });
    c.appendChild(sec);
    return c;
  }

  // ---- Autofill from resume pane ----
  function autofillPane() {
